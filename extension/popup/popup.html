<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>LeetCode AI Sync</h1>

    <section>
      <h2>Status</h2>
      <p id="github-status" class="status">● GitHub: not configured</p>
      <p id="gemini-status" class="status">● Gemini: not configured</p>
    </section>

    <section>
      <h2>Last submission</h2>
      <p id="last-submission" class="muted">None yet</p>
    </section>

    <section>
      <h2>Analysis</h2>
      <p id="analysis-state" class="muted">—</p>
      <div id="analysis" hidden>
        <p><strong>Algorithm:</strong> <span id="an-algo"></span></p>
        <p><strong>Time:</strong> <span id="an-time"></span></p>
        <p><strong>Space:</strong> <span id="an-space"></span></p>
        <p><strong>Key concept:</strong> <span id="an-key"></span></p>
      </div>
    </section>

    <div class="actions">
      <button id="open-github" disabled>View GitHub</button>
      <button id="open-settings">Settings</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
